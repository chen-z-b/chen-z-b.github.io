<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chen Zhibin</title>

  <style>
    body {
      margin: 0;
      background: #ffffff;
      color: #171717;
      font-family: Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
      font-size: 18px;
      line-height: 1.65;
    }

    main {
      max-width: 660px;
      margin: 92px auto;
      padding: 0 32px;
    }

    h1 {
      margin: 0 0 24px 0;
      font-size: 42px;
      font-weight: normal;
      line-height: 1.15;
      letter-spacing: 0.01em;
    }

    .affiliation {
      margin: 0 0 46px 0;
      color: #2b2b2b;
    }

    .institution {
      margin: 0;
    }

    .feature {
      margin: 0 0 42px 0;
      padding: 22px 0 20px 0;
      border-top: 1px solid #222;
      border-bottom: 1px solid #d6d6d6;
    }

    .feature-label {
      margin: 0 0 8px 0;
      font-size: 14px;
      letter-spacing: 0.055em;
      text-transform: uppercase;
      color: #666;
    }

    .feature-link {
      font-size: 22px;
      color: #171717;
      text-decoration: none;
      border-bottom: 1px solid #777;
    }

    .feature-link:hover {
      border-bottom-color: #171717;
    }

    .pdf-note {
      margin-left: 10px;
      font-size: 15px;
      color: #777;
    }

    .contact {
      margin: 0;
      color: #2b2b2b;
    }

    a {
      color: #171717;
      text-decoration: none;
      border-bottom: 1px solid #999;
    }

    a:hover {
      border-bottom-color: #171717;
    }

    @media (max-width: 600px) {
      main {
        margin: 58px auto;
        padding: 0 24px;
      }

      h1 {
        font-size: 35px;
      }

      body {
        font-size: 17px;
      }

      .feature-link {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Chen Zhibin</h1>

    <section class="affiliation">
      <p class="institution">Munich Center for Mathematical Philosophy (MCMP), LMU Munich</p>
    </section>

    <section class="feature">
      <p class="feature-label">Current presentation</p>
      <a class="feature-link" href="/sms26.pdf">SMS26 Handout</a>
      <span class="pdf-note">PDF</span>
    </section>

    <p class="contact">
      Email:
      <a href="mailto:chen.zhibin@campus.lmu.de">chen.zhibin@campus.lmu.de</a>
    </p>
  </main>
</body>
</html>
