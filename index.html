<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chen Zhibin</title>

  <style>
    :root {
      --text: #171717;
      --muted: #555555;
      --light: #777777;
      --rule: #d8d3ca;
      --background: #ffffff;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      font-size: 18px;
      line-height: 1.58;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      max-width: 620px;
      margin: 104px auto 80px;
      padding: 0 34px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 43px;
      font-weight: normal;
      line-height: 1.08;
      letter-spacing: 0.005em;
    }

    .affiliation {
      margin: 0 0 52px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.48;
    }

    .affiliation p {
      margin: 0;
    }

    .feature {
      margin: 0 0 42px;
      padding: 24px 0 0;
      border-top: 1px solid var(--rule);
    }

    .feature-label {
      margin: 0 0 7px;
      color: var(--light);
      font-size: 15px;
      font-style: italic;
    }

    .feature-main {
      margin: 0;
    }

    .feature-link {
      color: var(--text);
      font-size: 22px;
      line-height: 1.35;
      text-decoration: none;
      border-bottom: 1px solid #8f8f8f;
    }

    .feature-link:hover {
      border-bottom-color: var(--text);
    }

    .pdf-note {
      margin-left: 8px;
      color: var(--light);
      font-size: 15px;
    }

    .contact {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
    }

    a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid #9b9b9b;
    }

    a:hover {
      border-bottom-color: var(--text);
    }

    @media (max-width: 640px) {
      main {
        margin: 64px auto 56px;
        padding: 0 26px;
      }

      h1 {
        font-size: 36px;
      }

      .affiliation {
        font-size: 16.5px;
        margin-bottom: 44px;
      }

      .feature {
        margin-bottom: 36px;
      }

      .feature-link {
        font-size: 20px;
      }

      .contact {
        font-size: 16.5px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Chen Zhibin</h1>

    <section class="affiliation">
    <p class="contact">
      Email: chen.zhibin at campus.lmu.de
    </p>
      <p>Munich Center for Mathematical Philosophy (MCMP), LMU Munich</p>
    </section>

    <section class="feature">
      <p class="feature-label">Current presentation</p>
      <p class="feature-main">
        <a class="feature-link" href="/sms26.pdf">SMS26 Handout</a>
        <span class="pdf-note">PDF</span>
      </p>
    </section>
  </main>
</body>
</html>
